apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: laravel
  template:
    metadata:
      labels:
        app: laravel
    spec:
      containers:
        - name: laravel
          image: laravel-midlab:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          env:
            - name: APP_KEY
              value: "base64:jQpPujt8LDBp5GiUyzBVn7F3F3tfeD7dWwU4UugfqVA="
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
            - name: DB_CONNECTION
              value: mysql
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: laravel_db
            - name: DB_USERNAME
              value: laravel
            - name: DB_PASSWORD
              value: labpass123
---
apiVersion: v1
kind: Service
metadata:
  name: laravel-service
spec:
  type: NodePort
  selector:
    app: laravel
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
